name: Institutional Hybrid AI Sweep

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      backtest_date:
        description: 'Optional Backtest Date (YYYY-MM-DD)'
        required: false
        default: ''
      backtest_time:
        description: 'Optional Backtest Time (HH:MM) - Defaults to 15:30'
        required: false
        default: ''

jobs:
  run_quant_engine:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Python 3.11 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install AI Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy pandas faiss-cpu xgboost scikit-learn requests yfinance fyers_apiv3

    - name: Execute Live Hybrid Engine Scan
      env:
        # Fyers & Email configurations
        FYERS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        FYERS_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_APP_PWD: ${{ secrets.EMAIL_APP_PWD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        
        # Upstox Token
        UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        
        # GitHub Actions Inputs
        PARAM_BACKTEST_DATE: ${{ github.event.inputs.backtest_date }}
        PARAM_BACKTEST_TIME: ${{ github.event.inputs.backtest_time }}
      run: |
        # Build the command dynamically so it doesn't crash on empty inputs
        CMD="python -u System3.py"
        
        if [ -n "$PARAM_BACKTEST_DATE" ]; then
          CMD="$CMD --date $PARAM_BACKTEST_DATE"
        fi
        
        if [ -n "$PARAM_BACKTEST_TIME" ]; then
          CMD="$CMD --time $PARAM_BACKTEST_TIME"
        fi
        
        echo "Executing Command: $CMD"
        eval $CMD
