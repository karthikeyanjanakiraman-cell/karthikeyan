name: Institutional Hybrid AI Sweep

on:
  schedule:
    # Runs automatically at 10:30 UTC Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      trading_mode:
        description: 'Trading Universe'
        required: true
        default: 'STOCK_FNO'
        type: choice
        options:
          - STOCK_FNO
          - CASH_EQUITY
          - INDEX_OPTIONS
      backtest_date:
        description: 'Optional Backtest Date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      backtest_time:
        description: 'Optional Backtest Time (HH:MM) - Defaults to 15:30'
        required: false
        default: ''
        type: string
      track_symbol:
        description: 'Optional Tracking Symbol (Manual Fallback)'
        required: false
        default: ''
        type: string

jobs:
  run_quant_engine:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Python 3.11 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install AI Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy pandas faiss-cpu xgboost scikit-learn requests yfinance fyers_apiv3

    - name: Execute Stateful Hybrid Engine Scan
      env:
        # Fyers Configurations
        FYERS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        FYERS_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        
        # Email Alert Configurations
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        
        # Upstox Token
        UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        
        # Tracking Security Variable (Priority 1)
        SECRET_TRACK: ${{ secrets.TRACK_SYMBOL }}
        
        # GitHub Actions Manual Inputs (Priority 2)
        PARAM_MODE: ${{ inputs.trading_mode }}
        PARAM_BACKTEST_DATE: ${{ inputs.backtest_date }}
        PARAM_BACKTEST_TIME: ${{ inputs.backtest_time }}
        PARAM_TRACK: ${{ inputs.track_symbol }}
      run: |
        # Base Execution Command
        CMD="python -u System3.py"
        
        # 1. Inject Trading Mode (Defaults to STOCK_FNO for automated cron runs)
        if [ -n "$PARAM_MODE" ]; then
          CMD="$CMD --mode $PARAM_MODE"
        else
          CMD="$CMD --mode STOCK_FNO"
        fi
        
        # 2. Inject Optional Backtest Date
        if [ -n "$PARAM_BACKTEST_DATE" ]; then
          CMD="$CMD --date $PARAM_BACKTEST_DATE"
        fi
        
        # 3. Inject Optional Backtest Time
        if [ -n "$PARAM_BACKTEST_TIME" ]; then
          CMD="$CMD --time $PARAM_BACKTEST_TIME"
        fi

        # 4. Inject Stateless Tracking Symbol (Secret > Manual Input)
        if [ -n "$SECRET_TRACK" ]; then
          CMD="$CMD --track \"$SECRET_TRACK\""
        elif [ -n "$PARAM_TRACK" ]; then
          CMD="$CMD --track \"$PARAM_TRACK\""
        fi
        
        # Log and Execute
        echo "Executing Command: $CMD"
        eval $CMD
