name: Institutional Hybrid AI Sweep

on:
  schedule:
    # Runs automatically at 10:30 UTC Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      trading_mode:
        description: 'Trading Universe'
        required: true
        default: 'BOTH (STOCK_FNO & INDEX_OPTIONS)'
        type: choice
        options:
          - 'BOTH (STOCK_FNO & INDEX_OPTIONS)'
          - STOCK_FNO
          - INDEX_OPTIONS
          - CASH_EQUITY
      backtest_date:
        description: 'Optional Backtest Date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      backtest_time:
        description: 'Optional Backtest Time (HH:MM) - Defaults to 15:30'
        required: false
        default: ''
        type: string
      track_symbol:
        description: 'Optional Tracking Symbol (Manual Fallback)'
        required: false
        default: ''
        type: string

jobs:
  # Job 1: Resolve which modes to include in the matrix
  setup_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix_modes: ${{ steps.set_modes.outputs.modes }}
    steps:
      - name: Resolve Execution Matrix
        id: set_modes
        run: |
          INPUT_MODE="${{ inputs.trading_mode }}"
          
          # If scheduled (empty input) or default dual option selected, run both in parallel
          if [ -z "$INPUT_MODE" ] || [ "$INPUT_MODE" = "BOTH (STOCK_FNO & INDEX_OPTIONS)" ]; then
            echo 'modes=["STOCK_FNO", "INDEX_OPTIONS"]' >> $GITHUB_OUTPUT
          else
            echo "modes=[\"$INPUT_MODE\"]" >> $GITHUB_OUTPUT
          fi

  # Job 2: Runs concurrently for each mode output by Job 1
  run_quant_engine:
    needs: setup_matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Prevents one failing mode from aborting the other
      matrix:
        trading_mode: ${{ fromJson(needs:setup_matrix.outputs.matrix_modes) }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI Architecture Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pandas faiss-cpu xgboost scikit-learn requests yfinance fyers_apiv3

      - name: Execute Stateful Hybrid Engine Scan
        env:
          # Fyers Configurations
          FYERS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          
          # Email Alert Configurations
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          
          # Upstox Token
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          
          # Tracking Security Variable (Priority 1)
          SECRET_TRACK: ${{ secrets.TRACK_SYMBOL }}
          
          # GitHub Actions Inputs & Matrix Values
          CURRENT_MODE: ${{ matrix.trading_mode }}
          PARAM_BACKTEST_DATE: ${{ inputs.backtest_date }}
          PARAM_BACKTEST_TIME: ${{ inputs.backtest_time }}
          PARAM_TRACK: ${{ inputs.track_symbol }}
        run: |
          # Base execution command with the active matrix mode
          CMD="python -u System3.py --mode $CURRENT_MODE"
          
          # Optional backtest date
          if [ -n "$PARAM_BACKTEST_DATE" ]; then
            CMD="$CMD --date $PARAM_BACKTEST_DATE"
          fi
          
          # Optional backtest time
          if [ -n "$PARAM_BACKTEST_TIME" ]; then
            CMD="$CMD --time $PARAM_BACKTEST_TIME"
          fi

          # Stateless tracking symbol (Secret > Manual Input)
          if [ -n "$SECRET_TRACK" ]; then
            CMD="$CMD --track \"$SECRET_TRACK\""
          elif [ -n "$PARAM_TRACK" ]; then
            CMD="$CMD --track \"$PARAM_TRACK\""
          fi

          echo "=============================================="
          echo "Running parallel sweep for: $CURRENT_MODE"
          echo "Command: $CMD"
          echo "=============================================="
          eval $CMD
