name: Institutional Hybrid AI Sweep

on:
  schedule:
    # Runs automatically at 10:30 UTC Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      trading_mode:
        description: 'Trading Universe'
        required: true
        default: 'BOTH (STOCK_FNO & INDEX_OPTIONS)'
        type: choice
        options:
          - 'BOTH (STOCK_FNO & INDEX_OPTIONS)'
          - STOCK_FNO
          - INDEX_OPTIONS
          - CASH_EQUITY
      backtest_date:
        description: 'Optional Backtest Date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      backtest_time:
        description: 'Optional Backtest Time (HH:MM) - Defaults to 15:30'
        required: false
        default: ''
        type: string
      track_symbol:
        description: 'Optional Tracking Symbol (Manual Fallback)'
        required: false
        default: ''
        type: string

jobs:
  setup_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix_modes: ${{ steps.set_modes.outputs.modes }}
    steps:
      - name: Resolve Execution Matrix
        id: set_modes
        run: |
          INPUT_MODE="${{ inputs.trading_mode }}"
          
          if [ -z "$INPUT_MODE" ] || [ "$INPUT_MODE" = "BOTH (STOCK_FNO & INDEX_OPTIONS)" ]; then
            echo 'modes=["STOCK_FNO", "INDEX_OPTIONS"]' >> "$GITHUB_OUTPUT"
          else
            echo "modes=[\"$INPUT_MODE\"]" >> "$GITHUB_OUTPUT"
          fi

  run_quant_engine:
    needs: setup_matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # FIXED: Uses dot notation (needs.setup_matrix) instead of a colon
        trading_mode: ${{ fromJson(needs.setup_matrix.outputs.matrix_modes) }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v2-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-pip-v2-

      - name: Install Architecture Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas faiss-cpu xgboost scikit-learn requests yfinance fyers_apiv3

      - name: Execute Stateful Hybrid Engine Scan
        env:
          FYERS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          SECRET_TRACK: ${{ secrets.TRACK_SYMBOL }}
          CURRENT_MODE: ${{ matrix.trading_mode }}
          PARAM_BACKTEST_DATE: ${{ inputs.backtest_date }}
          PARAM_BACKTEST_TIME: ${{ inputs.backtest_time }}
          PARAM_TRACK: ${{ inputs.track_symbol }}
        run: |
          ARGS=("-u" "System3.py" "--mode" "$CURRENT_MODE")

          if [ -n "$PARAM_BACKTEST_DATE" ]; then
            ARGS+=("--date" "$PARAM_BACKTEST_DATE")
          fi

          if [ -n "$PARAM_BACKTEST_TIME" ]; then
            ARGS+=("--time" "$PARAM_BACKTEST_TIME")
          fi

          if [ -n "$SECRET_TRACK" ]; then
            ARGS+=("--track" "$SECRET_TRACK")
          elif [ -n "$PARAM_TRACK" ]; then
            ARGS+=("--track" "$PARAM_TRACK")
          fi

          echo "=============================================="
          echo "Executing parallel scan for: $CURRENT_MODE"
          echo "Arguments: ${ARGS[*]}"
          echo "=============================================="

          python "${ARGS[@]}"
