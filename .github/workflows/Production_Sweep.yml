name: Institutional Hybrid AI Sweep

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      backtest_date:
        description: 'Optional Backtest Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run_quant_engine:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Python 3.11 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install AI Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy pandas faiss-cpu xgboost scikit-learn requests yfinance

    - name: Execute Live Hybrid Engine Scan
      env:
        UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        PARAM_BACKTEST_DATE: ${{ github.event.inputs.backtest_date }}
      run: |
        python System.py
