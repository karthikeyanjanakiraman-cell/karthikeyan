name: Institutional Hybrid AI Sweep

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      backtest_date:
        description: 'Optional Backtest Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run_quant_engine:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Python 3.11 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install AI Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy pandas faiss-cpu xgboost scikit-learn requests yfinance fyers_apiv3

    - name: Execute Live Hybrid Engine Scan
      env:
        # THE FIX: Added the exact Fyers credentials the script is demanding
        FYERS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        FYERS_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        
        # THE FIX: Matched the exact Email variable names expected by Python
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_APP_PWD: ${{ secrets.EMAIL_APP_PWD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        
        # Kept your Upstox token intact for your other AI Engine
        UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        
        PARAM_BACKTEST_DATE: ${{ github.event.inputs.backtest_date }}
      run: |
        python System1.py

    - name: Execute System (AI Engine)
      if: always()
      env:
        # Replicated the exact same bridge for the second script
        FYERS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        FYERS_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_APP_PWD: ${{ secrets.EMAIL_APP_PWD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        
        UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        
        PARAM_BACKTEST_DATE: ${{ github.event.inputs.backtest_date }}
      run: |
        python System.py
