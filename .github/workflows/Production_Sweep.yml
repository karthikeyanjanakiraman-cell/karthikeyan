name: Institutional Hybrid AI Sweep

on:
  schedule:
    # Runs automatically at 10:30 UTC Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      trading_mode:
        description: 'Trading Universe'
        required: true
        default: 'INDEX_OPTIONS'
        type: choice
        options:
          - STOCK_FNO
          - CASH_EQUITY
          - INDEX_OPTIONS
      backtest_date:
        description: 'Optional Backtest Date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      backtest_time:
        description: 'Optional Backtest Time (HH:MM) - Defaults to 15:30'
        required: false
        default: ''
        type: string
      track_symbol:
        description: 'Optional Tracking Symbol (Manual Fallback)'
        required: false
        default: ''
        type: string

jobs:
  run_quant_engine:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Python 3.11 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install AI Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy pandas faiss-cpu xgboost scikit-learn requests yfinance fyers_apiv3

    - name: Execute Stateful Hybrid Engine Scan
      env:
        # Fyers Configurations
        FYERS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        FYERS_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        
        # Email Alert Configurations
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        
        # Upstox Token
        UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        
        # Tracking Security Variable (Priority 1)
        SECRET_TRACK: ${{ secrets.TRACK_SYMBOL }}
        
        # Default fallback context for scheduled triggers
        TRADING_MODE: ${{ github.event.inputs.trading_mode || 'INDEX_OPTIONS' }}
        BACKTEST_DATE: ${{ github.event.inputs.backtest_date }}
        BACKTEST_TIME: ${{ github.event.inputs.backtest_time }}
        TRACK_SYMBOL: ${{ github.event.inputs.track_symbol }}
      run: |
        # Run 1: Override TRADING_MODE explicitly for INDEX_OPTIONS
        TRADING_MODE=INDEX_OPTIONS python main.py
        
        # Run 2: Override TRADING_MODE explicitly for STOCK_FNO
        TRADING_MODE=STOCK_FNO python main.py
