name: Institutional Hybrid AI Sweep

on:
  schedule:
    # Runs automatically at 10:30 UTC Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      trading_mode:
        description: 'Trading Universe'
        required: true
        default: 'BOTH (STOCK_FNO & INDEX_OPTIONS)'
        type: choice
        options:
          - 'BOTH (STOCK_FNO & INDEX_OPTIONS)'
          - STOCK_FNO
          - INDEX_OPTIONS
          - CASH_EQUITY
      backtest_date:
        description: 'Optional Backtest Date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      backtest_time:
        description: 'Optional Backtest Time (HH:MM) - Defaults to 15:30'
        required: false
        default: ''
        type: string
      track_symbol:
        description: 'Optional Tracking Symbol (Manual Fallback)'
        required: false
        default: ''
        type: string

jobs:
  run_quant_engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Pip Wheelhouse
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v4
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Architecture Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas faiss-cpu xgboost scikit-learn requests yfinance fyers_apiv3

      - name: Execute Sequential AI Sweep
        env:
          FYERS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          SECRET_TRACK: ${{ secrets.TRACK_SYMBOL }}
          INPUT_MODE: ${{ inputs.trading_mode }}
          PARAM_BACKTEST_DATE: ${{ inputs.backtest_date }}
          PARAM_BACKTEST_TIME: ${{ inputs.backtest_time }}
          PARAM_TRACK: ${{ inputs.track_symbol }}
        run: |
          # 1. Determine modes to run
          if [ -z "$INPUT_MODE" ] || [ "$INPUT_MODE" = "BOTH (STOCK_FNO & INDEX_OPTIONS)" ]; then
            MODES=("STOCK_FNO" "INDEX_OPTIONS")
          else
            MODES=("$INPUT_MODE")
          fi

          # 2. Build common CLI arguments
          EXTRA_ARGS=()

          if [ -n "$PARAM_BACKTEST_DATE" ]; then
            EXTRA_ARGS+=("--date" "$PARAM_BACKTEST_DATE")
          fi

          if [ -n "$PARAM_BACKTEST_TIME" ]; then
            EXTRA_ARGS+=("--time" "$PARAM_BACKTEST_TIME")
          fi

          if [ -n "$SECRET_TRACK" ]; then
            EXTRA_ARGS+=("--track" "$SECRET_TRACK")
          elif [ -n "$PARAM_TRACK" ]; then
            EXTRA_ARGS+=("--track" "$PARAM_TRACK")
          fi

          # 3. Iterate sequentially
          for MODE in "${MODES[@]}"; do
            echo "=============================================="
            echo "Starting Engine for Mode: $MODE"
            echo "=============================================="

            # Build command array for this mode
            CMD_ARGS=("-u" "System3.py" "--mode" "$MODE")

            # For INDEX_OPTIONS, force email send so it doesn't get skipped when pure popups = 0
            if [ "$MODE" = "INDEX_OPTIONS" ]; then
              CMD_ARGS+=("--email-always-send" "--email-all-window-popups-content")
            fi

            CMD_ARGS+=("${EXTRA_ARGS[@]}")

            # Run Python script
            python "${CMD_ARGS[@]}"

            echo "Finished execution for $MODE"
            # 5-second pause to prevent SMTP throttle / API concurrency lockouts
            sleep 5
          done
