name: Fetch Market Data (Upstox)

on:
  workflow_dispatch:
    inputs:
      stock:
        description: 'Stock Name (e.g. RELIANCE, NIFTY)'
        required: true
        default: 'NIFTY'
      from_date:
        description: 'From Date (YYYY-MM-DD)'
        required: true
        default: '2024-01-01'
      to_date:
        description: 'To Date (YYYY-MM-DD)'
        required: true
        default: '2024-02-01'
      interval:
        description: 'Interval (e.g., 1, 5, 15, 30, 60, 1D)'
        required: true
        default: '1D'

jobs:
  fetch_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Upstox doesn't need a custom SDK, standard requests and pandas are perfect
      - name: Install dependencies
        run: pip install requests pandas

      - name: Write Python script
        run: |
          cat << 'EOF' > fetch_data.py
          import os
          import time
          import urllib.parse
          import json
          import gzip
          import io
          import requests
          import pandas as pd
          from datetime import datetime, timedelta

          ACCESS_TOKEN   = os.environ.get("UPSTOX_ACCESS_TOKEN")
          FROM_DATE      = os.environ["FROM_DATE"].strip()
          TO_DATE        = os.environ["TO_DATE"].strip()
          FETCH_INTERVAL = os.environ["FETCH_INTERVAL"].strip().upper()
          STOCK_INPUT    = os.environ["STOCK_NAME"].strip().upper()

          if not ACCESS_TOKEN:
              raise ValueError("❌ UPSTOX_ACCESS_TOKEN is missing! Please check your repository secrets.")

          # Map user intervals to Upstox API format
          interval_map = {
              "1": "1minute",
              "5": "5minute",
              "15": "15minute",
              "30": "30minute",
              "60": "60minute",
              "1D": "day",
              "DAY": "day"
          }
          upstox_interval = interval_map.get(FETCH_INTERVAL, "day")

          # Download and parse Upstox Master Contract to map symbol to instrument_key
          def get_instrument_key(symbol):
              print("🌐 Downloading Upstox NSE Master Contract to map symbol...")
              url = "https://assets.upstox.com/market-quote/instruments/exchange/NSE.json.gz"
              res = requests.get(url)
              data = json.load(gzip.GzipFile(fileobj=io.BytesIO(res.content)))
              
              # Map common alias inputs to Upstox Index Names
              aliases = {
                  "NIFTY": "NIFTY 50",
                  "NIFTY50": "NIFTY 50",
                  "BANKNIFTY": "NIFTY BANK",
                  "FINNIFTY": "NIFTY FIN SERVICE"
              }
              search_sym = aliases.get(symbol, symbol)

              for item in data:
                  if item.get("segment") in ["NSE_EQ", "NSE_INDEX"]:
                      # Strip out "-EQ" from Upstox equity symbols to match clean inputs
                      ts = item.get("trading_symbol", "").upper().replace("-EQ", "")
                      nm = item.get("name", "").upper()
                      if search_sym == ts or search_sym == nm:
                          return item.get("instrument_key")
              return None

          inst_key = get_instrument_key(STOCK_INPUT)
          if not inst_key:
              raise ValueError(f"❌ Could not find an Upstox instrument key for symbol: {STOCK_INPUT}")
          
          print(f"✅ Mapped '{STOCK_INPUT}' to Upstox Key: {inst_key}")

          def fetch_chunk(range_from, range_to):
              encoded_key = urllib.parse.quote(inst_key)
              url = f"https://api.upstox.com/v2/historical-candle/{encoded_key}/{upstox_interval}/{range_to}/{range_from}"
              headers = {
                  'Accept': 'application/json',
                  'Authorization': f'Bearer {ACCESS_TOKEN}'
              }
              print(f"Fetching chunk {range_from} to {range_to} ...")
              
              response = requests.get(url, headers=headers)
              if response.status_code == 200:
                  return response.json().get("data", {}).get("candles", [])
              else:
                  print(f"⚠️ API Error ({response.status_code}): {response.text}")
                  return []

          # Parse dates
          try:
              start_date = datetime.strptime(FROM_DATE, "%Y-%m-%d").date()
              end_date = datetime.strptime(TO_DATE, "%Y-%m-%d").date()
          except ValueError as e:
              raise ValueError(f"❌ Invalid date format. Use YYYY-MM-DD. Error: {e}")

          if start_date > end_date:
              raise ValueError(f"❌ FROM_DATE ({FROM_DATE}) cannot be after TO_DATE ({TO_DATE}).")

          # Chunk requests safely to avoid Upstox historical limits
          max_span_days = 90
          all_candles = []
          current_start = start_date

          while current_start <= end_date:
              current_end = min(current_start + timedelta(days=max_span_days), end_date)
              chunk_from = current_start.strftime("%Y-%m-%d")
              chunk_to = current_end.strftime("%Y-%m-%d")
              
              candles = fetch_chunk(chunk_from, chunk_to)
              all_candles.extend(candles)
              
              current_start = current_end + timedelta(days=1)
              time.sleep(0.3) # Rate limit safety

          # Build DataFrame
          if all_candles:
              df = pd.DataFrame(all_candles, columns=["timestamp", "open", "high", "low", "close", "volume", "oi"])
              
              # Safely parse Upstox ISO-8601 timestamps and convert to IST
              df["time"] = pd.to_datetime(df["timestamp"], utc=True).dt.tz_convert("Asia/Kolkata").dt.strftime("%Y-%m-%d %H:%M")
              df = df[["time", "open", "high", "low", "close", "volume"]]
              
              # Upstox returns data descending. Drop duplicates and sort ascending cleanly.
              df = df.drop_duplicates(subset=["time"]).sort_values("time")

              safe_symbol = STOCK_INPUT.replace(":", "_").replace("-", "_")
              filename = f"{safe_symbol}_{FROM_DATE}_to_{TO_DATE}_{FETCH_INTERVAL}.csv"

              df.to_csv(filename, index=False)
              print(f"🎉 Success! Data saved: {filename}")
          else:
              print("⚠️ Warning: No candles returned for the given date range.")

          EOF

      - name: Run Python script
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          STOCK_NAME: ${{ github.event.inputs.stock }}
          FROM_DATE: ${{ github.event.inputs.from_date }}
          TO_DATE: ${{ github.event.inputs.to_date }}
          FETCH_INTERVAL: ${{ github.event.inputs.interval }}
        run: python fetch_data.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.event.inputs.stock }}-${{ github.event.inputs.interval }}-${{ github.event.inputs.from_date }}-to-${{ github.event.inputs.to_date }}
          path: "*.csv"
          retention-days: 1
          
