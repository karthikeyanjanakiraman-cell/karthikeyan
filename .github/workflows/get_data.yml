name: Generate Historical F&O Data

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Start Date (Format: YYYY-MM-DD)'
        required: true
        default: ''
      to_date:
        description: 'End Date (Format: YYYY-MM-DD)'
        required: true
        default: ''

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Data Libraries
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Download Market History
      env:
        UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        PARAM_FROM_DATE: ${{ github.event.inputs.from_date }}
        PARAM_TO_DATE: ${{ github.event.inputs.to_date }}
      run: |
        python get_history.py

    - name: Upload CSV as Downloadable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: historical_fno_dataset
        path: historical_fno.csv
        retention-days: 7 # Optional: Deletes the artifact after 7 days to save space
        
